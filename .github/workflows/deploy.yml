name: Deploy

on:
    workflow_call:

env:
    CI: true

permissions:
    id-token: write # Required for OIDC
    contents: write
    pull-requests: write

jobs:
    deploy:
        concurrency:
            group: deploy-${{ github.sha }}
            cancel-in-progress: false
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Retrieve build cache
              id: cache
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
              with:
                  path: ./*
                  key: build-cache-${{ github.sha }}
                  fail-on-cache-miss: true

            - name: Install pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

            - name: Setup Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: latest

            - name: Create and publish versions
              id: changesets
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
              with:
                  commit: 'chore: update versions'
                  title: 'chore: update versions'
                  publish: pnpm publish -r --access public --no-git-checks
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # The extension is `private: true`, so `pnpm publish -r` above skips it and it
            # never reaches npm. Changesets still versions it, so publish it here.
            #
            # `hasChangesets == 'false'` is what makes this a release-only step. When
            # changesets are pending, the action above has already rewritten every
            # package.json in this workspace to the next version in order to raise its
            # version PR, so packaging at that point would ship a version main does not
            # have yet. Gating on `published` instead would not work: a changeset that
            # touches only this private package publishes nothing to npm, leaving that
            # output false on exactly the release we care about.
            #
            # Changesets bumps the extension whenever a package it bundles is bumped, even
            # when the bundled code it actually ships is unchanged. So fingerprint what
            # goes into the VSIX, leaving out the `version` field and CHANGELOG.md (the two
            # things every bump touches), and publish only a fingerprint not published yet.
            # The build is deterministic, so an unchanged extension hashes the same.
            #
            # Binaries are invoked directly rather than through `pnpm run`/`pnpm exec`:
            # this job restores node_modules from the build cache without running an
            # install, and a pnpm-mediated call would see deps as out of sync and, with
            # CI=true, silently purge that directory.
            - name: Fingerprint VS Code extension
              id: vscode
              if: steps.changesets.outputs.hasChangesets == 'false'
              working-directory: apps/vscode-extension
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
              run: |
                  set -euo pipefail
                  if [ -z "${VSCE_PAT:-}" ]; then
                      echo "VSCE_PAT is not set; skipping the marketplace publish."
                      exit 0
                  fi
                  node esbuild.mjs --production
                  fingerprint=$(
                      ./node_modules/.bin/vsce ls --no-dependencies | LC_ALL=C sort | while IFS= read -r file; do
                          case "$file" in
                              CHANGELOG.md) ;;
                              package.json) echo "$(jq -S 'del(.version)' package.json | sha256sum | cut -d' ' -f1)  package.json" ;;
                              *) sha256sum "$file" ;;
                          esac
                      done | sha256sum | cut -d' ' -f1
                  )
                  echo "Extension fingerprint: $fingerprint"
                  echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

            # A cache entry keyed on the fingerprint records that it was published. A miss,
            # including an entry GitHub has evicted, only costs a redundant publish, which
            # `--skip-duplicate` below keeps harmless.
            - name: Look up published fingerprint
              id: vscode-published
              if: steps.vscode.outputs.fingerprint != ''
              uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
              with:
                  path: ${{ runner.temp }}/vscode-published
                  key: vscode-extension-published-${{ steps.vscode.outputs.fingerprint }}
                  lookup-only: true

            # `--skip-duplicate` keeps a re-run idempotent. vsce has no retry or timeout
            # flag and the gallery API intermittently times out after 180s, so retry here.
            - name: Publish VS Code extension
              id: vscode-publish
              if: steps.vscode.outputs.fingerprint != '' && steps.vscode-published.outputs.cache-hit != 'true'
              working-directory: apps/vscode-extension
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
              run: |
                  set -euo pipefail
                  for attempt in 1 2 3; do
                      if ./node_modules/.bin/vsce publish --no-dependencies --skip-duplicate; then
                          exit 0
                      fi
                      echo "Attempt $attempt failed."
                      if [ "$attempt" -lt 3 ]; then sleep 30; fi
                  done
                  echo "vsce publish failed after 3 attempts." >&2
                  exit 1

            - name: Mark fingerprint as published
              if: steps.vscode-publish.outcome == 'success'
              run: |
                  mkdir -p "$RUNNER_TEMP/vscode-published"
                  jq -r .version apps/vscode-extension/package.json > "$RUNNER_TEMP/vscode-published/version"

            - name: Record published fingerprint
              if: steps.vscode-publish.outcome == 'success'
              uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
              with:
                  path: ${{ runner.temp }}/vscode-published
                  key: vscode-extension-published-${{ steps.vscode.outputs.fingerprint }}
