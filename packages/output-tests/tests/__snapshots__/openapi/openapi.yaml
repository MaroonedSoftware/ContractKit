openapi: '3.1.0'
info:
  title: 'Kitchen Sink'
  version: '1.0.0'
paths:
  '/payments':
    post:
      operationId: createPayment
      description: 'create a payment'
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              '$ref': '#/components/schemas/Payment'
      responses:
        '200':
          description: 'Successful response'
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Payment'
          headers:
            x-request-id:
              schema:
                type: string
              required: true
            x-ratelimit-remaining:
              schema:
                type: integer
              required: true
            x-cache-hit:
              schema:
                type: boolean
            x-expires-after:
              schema:
                type: string
                format: date-time
        '400':
          description: 'Bad request'
    get:
      operationId: listPayments
      description: 'list payments'
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: cursor
          in: query
          required: true
          schema:
            type: string
        - name: api-key
          in: header
          required: false
          schema:
            type: string
        - name: x-tenant
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Successful response'
          content:
            'application/json':
              schema:
                type: array
                items:
                  '$ref': '#/components/schemas/Payment'
  '/payments/{paymentId}':
    get:
      operationId: getPayment
      description: 'fetch one payment'
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Successful response'
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Payment'
        '404':
          description: 'Not found'
    post:
      operationId: updatePaymentWithForm
      description: 'update a payment with form data'
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          'application/x-www-form-urlencoded':
            schema:
              '$ref': '#/components/schemas/UpdatePaymentForm'
      responses:
        '204':
          description: 'No content'
    delete:
      operationId: deletePayment
      description: 'delete a payment — declares only a documented error status'
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '400':
          description: 'Bad request'
  '/payments/{paymentId}/receipt':
    post:
      operationId: uploadReceipt
      description: 'upload a receipt image'
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          'multipart/form-data':
            schema:
              '$ref': '#/components/schemas/UploadReceiptForm'
      responses:
        '200':
          description: 'Successful response'
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Payment'
  '/refunds/{paymentId}':
    get:
      operationId: getRefund
      description: 'look up a refund by its originating payment'
      parameters:
        - name: PaymentRef
          in: path
          required: true
          schema:
            '$ref': '#/components/schemas/PaymentRef'
      responses:
        '200':
          description: 'Successful response'
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Payment'
        '404':
          description: 'Not found'
      deprecated: true
  '/credentials':
    post:
      operationId: createCredential
      description: 'store a credential'
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              '$ref': '#/components/schemas/AdminCredential'
      responses:
        '200':
          description: 'Successful response'
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Credential'
  '/sessions':
    post:
      operationId: createSession
      description: 'open a session'
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              '$ref': '#/components/schemas/Session'
      responses:
        '200':
          description: 'Successful response'
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Session'
  '/invoices/{invoice-id}':
    get:
      operationId: getInvoice
      description: 'fetch an invoice'
      parameters:
        - name: invoice-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Successful response'
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Invoice'
        '404':
          description: 'Not found'
  '/folders/{folder-id}':
    get:
      operationId: getFolder
      description: 'several statuses, and two content types on one of them'
      parameters:
        - name: folder-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: depth
          in: query
          required: false
          schema:
            type: integer
        - name: tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: x-trace
          in: header
          required: true
          schema:
            type: string
        - name: x-opt
          in: header
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 'Successful response'
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Folder'
            'text/plain':
              schema:
                type: string
          headers:
            x-count:
              schema:
                type: integer
              required: true
            x-when:
              schema:
                type: string
                format: date-time
        '204':
          description: 'No content'
        '404':
          description: 'Not found'
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Shared'
    put:
      operationId: import
      description: 'a method name that is a keyword in the target languages'
      parameters:
        - name: folder-id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              '$ref': '#/components/schemas/Shared'
      responses:
        '200':
          description: 'Successful response'
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Instrument'
  '/tokens':
    post:
      operationId: mint
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              '$ref': '#/components/schemas/Token'
      responses:
        '201':
          description: Created
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Token'
        '400':
          description: 'Bad request'
    get:
      operationId: listTokens
      responses:
        '200':
          description: 'Successful response'
          content:
            'application/json':
              schema:
                type: array
                items:
                  '$ref': '#/components/schemas/Token'
  '/status':
    get:
      operationId: getStatus
      description: 'current service status'
      responses:
        '200':
          description: 'Successful response'
          content:
            'application/json':
              schema:
                '$ref': '#/components/schemas/Heartbeat'
components:
  schemas:
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: number
          minimum: 0
        unitPrice:
          type: string
          format: decimal
          pattern: '^-?\d+(\.\d{1,2})?$'
          x-contractkit-scale: 2
        quantity:
          type: string
          format: bigint
          pattern: '^-?\d+n?$'
        createdAt:
          type: string
          format: date-time
        processingTime:
          type: string
          format: duration
        status:
          type: string
          enum: [pending, completed, failed]
          default: pending
      required: [id, amount, unitPrice, quantity, createdAt, status]
      description: 'A customer payment'
    Credential:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        secret:
          type: string
          writeOnly: true
      required: [id, secret]
      description: 'A stored credential — has a writeonly child, so its Base schema is read'
    AdminCredential:
      allOf:
        - '$ref': '#/components/schemas/Credential'
        - type: object
          properties:
            scope:
              type: string
            token:
              type: string
              writeOnly: true
          required: [scope, token]
    Session:
      type: object
      properties:
        id:
          type: string
        refreshToken:
          type: string
          writeOnly: true
      required: [id, refreshToken]
      description: 'A writeonly model nothing extends — its Base schema has no reader'
    PaymentRef:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
      required: [paymentId]
      description: 'Path params declared as a model, referenced via `params: PaymentRef`'
    UpdatePaymentForm:
      type: object
      properties:
        note:
          type: string
    UploadReceiptForm:
      type: object
      properties:
        caption:
          type: string
        file:
          type: string
          format: binary
    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: '^-?\d+(\.\d{1,2})?$'
          x-contractkit-scale: 2
      required: [id, total]
    Rating:
      type: string
      enum: [good, neutral, bad]
      description: 'A named enum, so a field default has to resolve to a member rather than its wire spelling'
    Folder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        class:
          type: string
        default:
          type: string
        rating:
          '$ref': '#/components/schemas/Rating'
          default: neutral
        parent:
          '$ref': '#/components/schemas/Folder'
        readme:
          '$ref': '#/components/schemas/Doc'
        children:
          type: array
          items:
            '$ref': '#/components/schemas/Folder'
        byName:
          type: object
          additionalProperties:
            '$ref': '#/components/schemas/Folder'
        span:
          type: array
          prefixItems:
            - type: integer
            - type: integer
        stamped:
          type: array
          prefixItems:
            - type: string
              format: uuid
            - type: string
              format: date-time
            - type: boolean
        label:
          oneOf:
            - type: string
            - type: integer
        pinned:
          oneOf:
            - '$ref': '#/components/schemas/Doc'
            - '$ref': '#/components/schemas/Folder'
        instrument:
          oneOf:
            - '$ref': '#/components/schemas/Card'
            - '$ref': '#/components/schemas/Bank'
        origin:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
          required: [x, y]
        size:
          type: string
          format: bigint
          pattern: '^-?\d+n?$'
        price:
          type: string
          format: decimal
          pattern: '^-?\d+(\.\d{1,2})?$'
          x-contractkit-scale: 2
        day:
          type: string
          format: date
        at:
          type: string
          format: time
        ttl:
          type: string
          format: duration
        blob:
          type: string
          format: binary
        extra: {}
        raw: {}
      required: [id, class, children, label, pinned, size, price]
      description: "Self recursion through lazy(), mutual recursion through Doc, every container, both union\nforms, every scalar, and field names that are keywords in the target languages"
    Doc:
      type: object
      properties:
        id:
          type: string
          format: uuid
        folder:
          '$ref': '#/components/schemas/Folder'
      required: [id]
    Card:
      type: object
      properties:
        kind:
          const: card
        last4:
          type: string
          minLength: 4
          maxLength: 4
      required: [kind, last4]
    Bank:
      type: object
      properties:
        kind:
          const: bank
        iban:
          type: string
      required: [kind, iban]
    Instrument:
      oneOf:
        - '$ref': '#/components/schemas/Card'
        - '$ref': '#/components/schemas/Bank'
      discriminator:
        propertyName: kind
        mapping:
          card: '#/components/schemas/Card'
          bank: '#/components/schemas/Bank'
    Token:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          default: 3600
      required: [accessToken]
      description: 'Decodes snake_case keys and encodes PascalCase ones'
    Owned:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        secret:
          type: string
          writeOnly: true
      required: [id, secret]
    Named:
      type: object
      properties:
        name:
          type: string
      required: [name]
    Shared:
      allOf:
        - '$ref': '#/components/schemas/Owned'
        - '$ref': '#/components/schemas/Named'
        - type: object
          properties:
            label:
              type: string
              default: x
            instrument:
              '$ref': '#/components/schemas/Instrument'
    Heartbeat:
      type: object
      properties:
        status:
          type: string
        checkedAt:
          type: string
          format: date-time
      required: [status, checkedAt]
      description: 'A service heartbeat — deliberately no bigint field and no `area` key'